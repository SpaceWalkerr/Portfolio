        <p>

        </p>
        <h2>Case studies</h2>

        <h2><a href="/books">Books by Suraj Nandan</a></h2>
        <p>
          <a href="/books/above-the-clouds">Above the Clouds</a> — a horror thriller novel by Suraj Nandan: a gas over Delhi, a train home

          (https://www.amazon.com/dp/B0HRS3N5T6).
        </p>
        <p>
          <a href="/book">Unscrolled: Reclaim Your Focus, Time and Ambition in a World Built to Distract You</a> —
          a self-help book by Suraj Nandan about taking your attention back, now on Amazon (https://www.amazon.in/dp/B0HQ61YYC4).
        </p>
